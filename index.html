<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Místico - Oráculo Virtual</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte opcional para um visual mais místico -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="stars"></div>
    <div class="twinkling"></div>

    <div class="container">
        <header>
            <h1>Oráculo do Tarot</h1>
            <p class="subtitle">Conecte-se com o subconsciente e encontre suas respostas</p>
        </header>

        <!-- Seção do Formulário de Pergunta -->
        <main class="game-area">
            <div class="input-section">
                <label for="user-question">Qual é a sua dúvida ou intenção para o oráculo?</label>
                <input type="text" id="user-question" placeholder="Ex: O que devo focar na minha carreira esta semana?" autocomplete="off">
                <button id="btn-draw">Mentalizar e Jogar (R$ 1,00)</button>
                <p class="payment-notice">* Na próxima etapa, este botão gerará o Pix de R$ 1,00 antes de revelar as cartas.</p>
            </div>

            <!-- Tabuleiro das Cartas -->
            <div class="tarot-table">
                <!-- Carta 1 -->
                <div class="card-container">
                    <div class="card" id="card-1">
                        <div class="card-face card-back">
                            <div class="card-back-design">🔮</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-content">
                                <h3 class="card-title">Carta 1</h3>
                                <div class="card-illustration">✨</div>
                                <p class="card-position-label">Passado / A Situação</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Carta 2 -->
                <div class="card-container">
                    <div class="card" id="card-2">
                        <div class="card-face card-back">
                            <div class="card-back-design">🔮</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-content">
                                <h3 class="card-title">Carta 2</h3>
                                <div class="card-illustration">✨</div>
                                <p class="card-position-label">Presente / O Desafio</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Carta 3 -->
                <div class="card-container">
                    <div class="card" id="card-3">
                        <div class="card-face card-back">
                            <div class="card-back-design">🔮</div>
                        </div>
                        <div class="card-face card-front">
                            <div class="card-content">
                                <h3 class="card-title">Carta 3</h3>
                                <div class="card-illustration">✨</div>
                                <p class="card-position-label">Futuro / O Caminho</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Área do Resultado da Leitura -->
            <div id="reading-result" class="reading-result hidden">
                <h2>A Interpretação do Oráculo</h2>
                <div id="reading-text" class="reading-text">
                    <!-- O texto da IA entrará aqui -->
                </div>
                <button id="btn-reset">Fazer Nova Consulta</button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
